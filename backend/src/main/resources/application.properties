spring.application.name=Counting-Tree-App

# ==== MySQL connection ====
spring.datasource.url=jdbc:mysql://localhost:3306/db_countingTree
# Connection URL (default MySQL port 3306)

# User & password
spring.datasource.username=root
spring.datasource.password=1234

# ==== Security User ====
spring.security.user.name=admin
spring.security.user.password=admin123

# ==== JPA / Hibernate configuration ====
spring.jpa.hibernate.ddl-auto=update
# Creates or updates tables based on your entities (development only)

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Pretty-print generated SQL queries in the console

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# SQL dialect for MySQL 8 compatibility
